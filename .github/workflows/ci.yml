name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Run focused lint
        run: python -m ruff check main.py scripts tests/test_detector.py tests/test_db_handler.py
      - name: Run tests
        run: python -m pytest -q
