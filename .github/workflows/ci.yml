name: CI

on:
  push:
    branches: [main, phase-1-stabilize]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Run focused lint
        run: python -m ruff check main.py tests scripts
      - name: Run tests
        run: python -m pytest -q
