name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install system runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run production application self-test
        run: python main.py --self-test
      - name: Check OpenCV face APIs
        run: >-
          python -c "import cv2; assert hasattr(cv2, 'FaceDetectorYN');
          assert hasattr(cv2, 'FaceRecognizerSF'); assert hasattr(cv2, 'dnn');
          assert hasattr(cv2.dnn, 'readNetFromONNX')"
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Compile complete Python tree
        run: python -m compileall -q main.py scripts src tests
      - name: Run maintained-surface lint
        run: >-
          python -m ruff check
          main.py scripts
          src/auth/auth_system.py
          src/auth/simple_auth.py
          src/core/paths.py
          src/core/runtime.py
          src/core/version.py
          src/core/camera.py
          src/core/face_models.py
          src/core/face_engine.py
          src/core/liveness.py
          src/core/utils/config_manager.py
          src/core/face_recognition/face_detector.py
          src/core/database/repository.py
          src/core/database/service.py
          src/core/database/compat_exports.py
          src/core/database/db_handler.py
          src/database/db_handler.py
          src/database/db_manager.py
          src/database/enhanced_db.py
          src/database/sqlite_handler.py
          src/face_recognition/detector.py
          src/face_recognition/enhanced_detector.py
          src/face_recognition/fixed_detector.py
          src/cli/main.py
          src/cli/train.py
          src/cli/take_attendance.py
          src/cli/view_attendance.py
          src/ui/access_policy.py
          src/ui/attendance_reporting.py
          src/ui/auth_gate.py
          src/ui/legacy_face_compat.py
          src/ui/attendance_view.py
          src/ui/dashboard_view.py
          src/ui/analytics_dashboard.py
          src/ui/student_registration.py
          src/ui/training_view.py
          src/ui/settings.py
          src/ui/modern_launcher.py
          src/utils/backup_manager.py
          src/utils/config_manager.py
          tests/test_detector.py
          tests/test_face_engine.py
          tests/test_liveness.py
          tests/test_camera.py
          tests/test_runtime.py
          tests/test_db_handler.py
          tests/test_repository.py
          tests/test_ui_adapters.py
          tests/test_auth_system.py
          tests/test_config_backup.py
          tests/test_production_imports.py
          tests/test_production_ui.py
      - name: Run tests
        run: python -m pytest -q

  package-smoke:
    name: package-${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run platform regression tests
        run: >-
          python -m pytest -q
          tests/test_camera.py
          tests/test_runtime.py
          tests/test_face_engine.py
          tests/test_liveness.py
          tests/test_auth_system.py
          tests/test_config_backup.py
          tests/test_production_imports.py
          tests/test_production_ui.py
      - name: Build one-folder application
        run: python -m PyInstaller --clean --noconfirm face_attendance.spec
      - name: Smoke-test packaged application
        run: python scripts/smoke_package.py
