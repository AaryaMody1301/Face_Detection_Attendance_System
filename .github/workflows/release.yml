name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: validate-release-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify tagged commit belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags --prune
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
      - name: Install Linux runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install constrained release dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -c constraints-release.txt -e ".[dev]" &&
          python -m pip check
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_release_version.py --tag "${{ github.ref_name }}"
      - name: Run production import self-test
        run: python main.py --self-test
      - name: Check repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Compile complete Python tree
        run: python -m compileall -q main.py scripts src tests
      - name: Run complete test suite
        run: python -m pytest -q

  package:
    name: build-${{ matrix.label }}
    needs: validate
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1
      - name: Install constrained release dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -c constraints-release.txt -e ".[dev]" &&
          python -m pip check
      - name: Run production import self-test
        run: python main.py --self-test
      - name: Build one-folder application
        run: python -m PyInstaller --clean --noconfirm face_attendance.spec
      - name: Smoke-test packaged application
        run: python scripts/smoke_package.py
      - name: Archive release bundle
        run: python scripts/archive_release.py --label "${{ matrix.label }}"
      - name: Attest release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "release/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FaceAttendance-${{ matrix.label }}
          path: release/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: FaceAttendance-*
          path: release
          merge-multiple: true
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "FaceAttendance $GITHUB_REF_NAME"
          fi
