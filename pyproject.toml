[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "face-detection-attendance-system"
version = "1.5.0"
description = "Local facial-recognition attendance management system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
  "opencv-contrib-python>=4.10,<5",
  "customtkinter>=5.2,<7",
  "Pillow>=10,<13",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4",
  "scikit-learn>=1.4,<2",
  "platformdirs>=4.11,<5",
  "ttkthemes>=3.2,<4",
  "tkcalendar>=1.6,<2",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "pyinstaller>=6.22,<7",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
